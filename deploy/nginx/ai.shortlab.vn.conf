# Public load balancer for the two local 9Router replicas.
upstream nine_router_ai {
    zone nine_router_ai 64k;
    server 127.0.0.1:20129 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:20130 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.shortlab.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.shortlab.vn;

    ssl_certificate /etc/letsencrypt/live/ai.shortlab.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.shortlab.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    location / {
        proxy_pass http://nine_router_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Keep long model responses and SSE streams intact.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
